<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reimpresión de Cortes - Halftime Inn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-xl mx-auto">
        <header class="mb-8">
            <a href="{{ url_for('dashboard') }}" class="text-indigo-600 font-bold flex items-center gap-2 mb-4">
                <i class="fas fa-arrow-left"></i> Volver al Dashboard
            </a>
            <h1 class="text-3xl font-black text-slate-900 tracking-tighter uppercase">Reimpresión de Cortes</h1>
            <p class="text-slate-500 font-medium">Sucursal ID: {{ current_user.sucursal_id }}</p>
        </header>

        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
            <form action="{{ url_for('reimpresion_cortes') }}" method="GET" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Seleccionar Recepcionista</label>
                    <select name="usuario_id" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none appearance-none">
                        <option value="" disabled selected>Escoge un usuario...</option>
                        {% for u in usuarios %}
                        <option value="{{ u.id }}">{{ u.username | upper }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Seleccionar Fecha del Corte</label>
                    <input type="date" name="fecha" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <button type="submit" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-indigo-600 transition transform active:scale-95 flex items-center justify-center gap-3">
                    <i class="fas fa-search"></i> GENERAR VISTA PREVIA
                </button>
            </form>
        </div>

        <div class="mt-8 p-6 bg-indigo-50 rounded-2xl border border-indigo-100">
            <div class="flex gap-4">
                <i class="fas fa-info-circle text-indigo-500 text-xl"></i>
                <p class="text-xs text-indigo-800 font-medium leading-relaxed">
                    Al generar la vista previa, el sistema calculará el **Total Vendido** y el desglose de rentas (4h, 6h, 12h) basado en los registros históricos del día seleccionado.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
