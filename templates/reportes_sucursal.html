<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes de Sucursal - Halftime Inn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Gestión Operativa</h1>
                <p class="text-slate-500">Administrador de Sucursal</p>
            </div>
            <i class="fas fa-hotel text-slate-300 text-4xl"></i>
        </header>

        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 text-center">
            <div class="inline-flex p-4 bg-indigo-50 rounded-full text-indigo-600 mb-4">
                <i class="fas fa-chart-pie fa-2x"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-700 mb-6">Métricas Acumuladas</h2>
            
            <div class="grid grid-cols-1 gap-6">
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                    <p class="text-slate-400 font-bold uppercase text-xs">Total de Rentas Históricas</p>
                    <p class="text-6xl font-black text-slate-800">{{ stats.total if stats else 0 }}</p>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t flex justify-center gap-4">
                <a href="{{ url_for('registro_usuario') }}" class="bg-slate-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-black transition">
                    Registrar Personal
                </a>
            </div>
        </div>

        <div class="mt-6">
            <a href="{{ url_for('dashboard') }}" class="text-indigo-600 font-bold hover:underline">
                <i class="fas fa-arrow-left"></i> Volver al Dashboard
            </a>
        </div>
    </div>
</body>
</html>
